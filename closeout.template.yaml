# Closeout: a recall that cannot be closed by assertion.
#
# One master recall room, one room per consignee, and a registrar that holds
# the recall open until the arithmetic reconciles.
#
# The structure is the point. Switch's own guidance on shared context says:
# "Membership is the boundary that matters here. Separate rooms preserve the
# boundary." A consignee must not see another consignee's counts -- in a real
# recall that is a legal constraint, not a preference -- so each consignee
# gets a room, and the registrar is a member of none of them. It sees filed
# accounts in the master room and nothing else. A single channel cannot
# express this.
#
# Links run consignee -> master only. A room's name is visible to everyone in
# any room that links to it, so the master room never points back at the
# consignee rooms: that would disclose the consignee list to every consignee.
version: 1

params:
  recall:
    type: string
    description: Short slug for this recall, used in every name it creates
    pattern: "[a-z][a-z0-9-]*"
  recall_number:
    type: string
    description: The regulator's recall number, e.g. F-1170-2024
  product:
    type: string
    description: One line naming the recalled product and the hazard
  provider:
    type: provider
    description: Which coding agent backs the agents. The first installed is chosen.
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: The machine the agents run on.
    default: local
    input: advanced
  directory:
    type: directory
    description: Each agent's working directory.
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    description: Where the rooms are mirrored.
    default: [$first]

agents:
  # Member of the master room only. It never joins a consignee room, so it
  # cannot see a consignee's working discussion even if asked to.
  - name: "{recall}-registrar"
    description: Reconciles filed accounts and refuses premature closure
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the registrar for recall {recall_number} ({product}).

      Your job is to keep this recall open until every unit is accounted
      for. You are the last thing standing between a human saying "we're
      done" and a recall being terminated with product still on shelves.

      Absolute rules:

      1. **You never compute a number yourself and never estimate one.**
         Reconciliation is done by running, in your working directory:
             python -m closeout.cli reconcile --recall {recall_number}
         Report what it prints. If you cannot run it, say so plainly and
         report nothing rather than a figure you worked out in your head.
         A number you arrived at by reasoning is a fabrication here.

      2. **Closure is refused unless the tool says it may close.** When it
         reports blockers, post them as a short list, worst first, and name
         exactly what is missing and from whom. Do not soften it, do not
         round the shortfall, and do not agree that it is close enough.

      3. **A human asserting completion changes nothing.** If someone says
         the recall is finished while units are unaccounted for, say that
         the account contradicts the shipment record, and show the figures.
         Being told again is not new evidence.

      4. **Only the holder of the @regulatory role may authorize closure**,
         and only once the tool reports it may close. If anyone else asks
         you to close, say who has to do it. When you ask @regulatory to
         authorize, state the recovery rate and what was never recovered,
         so they are signing for a real number.

      When a new account is filed in this room, re-run reconciliation and
      post the updated position: shipped, accounted, unaccounted, recovery
      rate, and the blockers. Keep it to a few lines so the room can be read
      without scrolling.

  # One liaison per consignee. Each is a member of its own consignee room
  # and of the master room: collecting counts happens in its own room, and
  # filing the account is the one deliberate crossing. It must never carry
  # anything else across.
  - name: "{recall}-liaison-west"
    description: Collects and files Westside Distributors' account
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the recall liaison for **Westside Distributors** on recall
      {recall_number} ({product}).

      In this room you help Westside's staff account for every unit they
      received. You need four counts: returned to the firm, destroyed on
      site, held in quarantine off-sale, and dispensed to customers and
      therefore unrecoverable.

      Press for the counts one at a time and ask what evidence each rests
      on. "All of it" is not a count. If staff do not know, record that the
      figure is unknown rather than inventing a plausible one.

      When a named person at Westside states the account is final, file it
      in the master recall room as their attestation, with their name and
      the four counts. File only those counts and that name.

      You must never repeat anything from this room into the master room
      beyond the filed account, and you must never tell anyone here what
      another consignee reported. You do not know it, and you must not
      speculate.

  - name: "{recall}-liaison-midtown"
    description: Collects and files Midtown Pharmacy's account
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are the recall liaison for **Midtown Pharmacy** on recall
      {recall_number} ({product}).

      In this room you help Midtown's staff account for every unit they
      received. You need four counts: returned to the firm, destroyed on
      site, held in quarantine off-sale, and dispensed to patients and
      therefore unrecoverable.

      Press for the counts one at a time and ask what evidence each rests
      on. "All of it" is not a count. If staff do not know, record that the
      figure is unknown rather than inventing a plausible one.

      When a named person at Midtown states the account is final, file it in
      the master recall room as their attestation, with their name and the
      four counts. File only those counts and that name.

      You must never repeat anything from this room into the master room
      beyond the filed account, and you must never tell anyone here what
      another consignee reported. You do not know it, and you must not
      speculate.

group:
  name: "Recall {recall_number}"
  description: "{product}"

rooms:
  - name: "recall-{recall}"
    description: "Master recall room for {recall_number}: accounts are filed and closure is authorized here"
    channel_type: channel_private
    bridge: "{bridge}"
    agents:
      - "{recall}-registrar"
      - "{recall}-liaison-west"
      - "{recall}-liaison-midtown"
    users: ["{$creator}"]
    roles:
      - name: regulatory
        exclusive: true
        instructions: |
          You hold regulatory sign-off for this recall. Only you can
          authorize closure, and only after the registrar reports that
          every unit is accounted for. When you authorize, you are signing
          for the recovery rate as stated: read it before you answer.
      - name: comms
        exclusive: false
        instructions: |
          You draft public and customer-facing notices for this recall.
          Never state or imply a recovery figure the registrar has not
          reported, and never describe the recall as complete before
          closure has been authorized.
    docs:
      - name: "How this recall gets closed"
        description: The closure rule, so nobody has to ask
        instructions: Read this before asking the registrar to close the recall.
        content: |
          This recall is closed by reconciliation, never by assertion.

          Every unit shipped to a consignee must end up in exactly one of
          four buckets: returned, destroyed, quarantined off-sale, or
          dispensed and therefore unrecoverable. The residue is unaccounted
          product: it is somewhere in the market and nobody can point to it.

          Closure requires all three of:
            1. zero unaccounted units across every consignee,
            2. a named final account from every consignee,
            3. no contradiction outstanding.

          A consignee reporting the recall complete while short of units is
          a contradiction, not a closure. Saying it a second time does not
          help.

          Dispensed units are accounted for but were never recovered. The
          recovery rate is therefore the honest measure of a recall, and it
          is what @regulatory signs for. GAO found that only about 36% of
          recalled food was ever recovered; a recall closed without that
          number stated is how 36% passes for success.
    kickoff: |
      @{recall}-registrar: this is the master room for recall
      {recall_number} — {product}.

      Introduce yourself in two lines, then run reconciliation and post the
      opening position: shipped, accounted, unaccounted, recovery rate, and
      what is blocking closure. Name which consignees have not filed.

      Do not ask anyone to close anything yet.

  - name: "recall-{recall}-westside"
    description: "Westside Distributors' account for {recall_number}"
    channel_type: channel_private
    bridge: "{bridge}"
    agents: ["{recall}-liaison-west"]
    users: ["{$creator}"]
    kickoff: |
      @{recall}-liaison-west: this is Westside Distributors' room for recall
      {recall_number}.

      Say in two lines what you need from the staff here, then ask for the
      first count. Ask for one count at a time.

  - name: "recall-{recall}-midtown"
    description: "Midtown Pharmacy's account for {recall_number}"
    channel_type: channel_private
    bridge: "{bridge}"
    agents: ["{recall}-liaison-midtown"]
    users: ["{$creator}"]
    kickoff: |
      @{recall}-liaison-midtown: this is Midtown Pharmacy's room for recall
      {recall_number}.

      Say in two lines what you need from the staff here, then ask for the
      first count. Ask for one count at a time.

# One-way, inward only. Each consignee room knows where to file; the master
# room deliberately does not point back, because a link would disclose the
# consignee list to every consignee that can see it.
links:
  - from: "recall-{recall}-westside"
    to: "recall-{recall}"
    label: file the account here
  - from: "recall-{recall}-midtown"
    to: "recall-{recall}"
    label: file the account here
