name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # The README claims Python 3.10+. Check the oldest and the newest,
      # because a claim nobody tests is a claim that quietly stops being true.
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # "No dependencies" is also a claim in the README.
      - name: The engine imports on a bare interpreter
        run: python -c "import closeout.recon, closeout.store, closeout.cli"

      # The engine is pure standard library on purpose: a judge cloning this
      # repo should not need a virtualenv to watch a recall refuse to close.
      - name: The demo, which is also an integration test
        run: ./scripts/demo.sh

      - name: Tests
        run: |
          python -m pip install --quiet pytest pyyaml
          python -m pytest tests/ -q
